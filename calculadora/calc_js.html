<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <script src="JscriptOperaciones.js">
    </script>

<style>
    body {
      background-color: #f0f0f0;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: #fff;
      padding: 30px;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    h2 {
      color: #333;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #000000;
      border-radius: 3px;
    }

    button {
      background-color: #ffe600;
      color: rgb(0, 0, 0);
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }

    button:hover {
      background-color: #ffee00;
    }
  </style>
</head>




<head>
  <meta charset="utf-8">
  <title>Calculadora</title>
  
</head>
<body>
    <center>
  <div class="container">
    <h2>Calculadora</h2>
    <form name="form" action="" method="get">
      <h2>Introduce el número 1</h2>
      <input type="text" name="num1"><br><br><br>
      <h2>Introduce el número 2</h2>
      <input type="text" name="num2"><br><br>
    </form>
    <button onclick="suma()">Suma</button><br>
    <button onclick="multi()">Multiplicacion</button><br>
    <button onclick="restar()">Restar</button><br>  
    <button onclick="dividir()">Dividir</button
</center>
</body>

</html>
